[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmapss-rul"
version = "0.1.0"
description = "FD001 data contracts and validation for a reproducible RUL study"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.3.3",
    "matplotlib==3.10.6",
    "seaborn==0.13.2",
    "scipy==1.16.2",
]

[project.scripts]
cmapss-validate = "cmapss.validate:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "jupyterlab==4.4.9",
    "ipykernel==6.30.1",
    "nbclient==0.10.2",
    "nbformat==5.10.4",
    "nbconvert==7.16.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
